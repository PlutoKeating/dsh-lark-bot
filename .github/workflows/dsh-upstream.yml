name: upstream-release-watch

on:
  schedule:
    # Daily; all versions newer than each reviewed baseline are processed.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Synchronize upstream release issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-dsh-upstream.mjs --sync-issues
