name: Deploy Landing to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/index.html
      - docs/llms.txt
      - docs/robots.txt
      - docs/sitemap.xml
      - .github/workflows/cf-pages.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7a495b2c871926a73fd06fbef7dd3b75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _cf_site
          cp docs/index.html docs/llms.txt docs/robots.txt docs/sitemap.xml _cf_site/

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy _cf_site --project-name=dsh-lark-bot --branch=main
