name: Deploy Landing to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/cf-pages.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7a495b2c871926a73fd06fbef7dd3b75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install landing site dependencies
        run: pnpm --dir docs/site install --frozen-lockfile

      - name: Build landing site
        run: pnpm --dir docs/site build

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy docs/site/dist --project-name=dsh-lark-bot --branch=main
