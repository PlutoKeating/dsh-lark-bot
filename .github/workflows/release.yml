name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check git diff
        run: git diff --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test built CLI
        run: |
          node bin/dsh-lark-bot.mjs --version
          node dist/cli.js --version

      - name: Publish both npm packages and build release artifacts
        run: node scripts/publish-dual-packages.mjs --pack-dir release-artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish both packages to GitHub Packages
        run: |
          npm_config_file="$RUNNER_TEMP/github-packages.npmrc"
          printf '@plutokeating:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$npm_config_file"
          NPM_CONFIG_USERCONFIG="$npm_config_file" node scripts/publish-dual-packages.mjs --github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGE_SCOPE: plutokeating

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.tgz
          generate_release_notes: true
          # Explicitly mark the just-published version as Latest. GitHub
          # otherwise defaults to the newest *published* release, so
          # republishing an old tag (e.g. backfilling notes) would silently
          # steal the Latest badge from the newest version.
          make_latest: true
